[project]
name = "focus-flow"
version = "0.1.0"
description = "A focused desktop time planner with a floating timer"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.8,<7",
    "PySide6-Addons>=6.8,<7",
]

[project.scripts]
focus-flow = "focus_flow.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
